<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">レボリスト11 役割マップ</title>
  <desc id="desc">4つの動き方と11の役割を、説明を先にして名称を添えた円環図。</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .axis { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 2; }
      .axis-title { font: 700 28px sans-serif; fill: #111827; }
      .axis-sub { font: 500 15px sans-serif; fill: #6b7280; }
      .node { fill: #ffffff; stroke-width: 3; filter: drop-shadow(0 10px 18px rgba(17,24,39,.08)); }
      .main { font: 700 19px sans-serif; fill: #111827; }
      .name { font: 700 14px sans-serif; fill: #6b7280; }
      .hint { font: 500 13px sans-serif; fill: #6b7280; }
      .line { fill: none; stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 6 8; }
      .center { fill: #111827; }
      .center-text { font: 700 22px sans-serif; fill: #ffffff; }
      .center-sub { font: 500 13px sans-serif; fill: #d1d5db; }
      .ignite { stroke: #e2543e; }
      .design { stroke: #7c3aed; }
      .connect { stroke: #f97316; }
      .structure { stroke: #2563eb; }
      .care { stroke: #16a34a; }
      .rare { fill: #fff7ed; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <text x="700" y="66" text-anchor="middle" style="font: 800 36px sans-serif; fill: #111827;">レボリスト11 役割マップ</text>
  <text x="700" y="98" text-anchor="middle" style="font: 500 16px sans-serif; fill: #6b7280;">説明で役割をつかみ、名前は後から覚える。近い役割は理解しやすく、離れた役割は補完が強い。</text>

  <path class="line" d="M700 160 C1020 160 1240 360 1240 500 C1240 660 1015 820 700 820 C385 820 160 660 160 500 C160 360 380 160 700 160 Z"/>
  <circle class="center" cx="700" cy="500" r="116"/>
  <text class="center-text" x="700" y="484" text-anchor="middle">組み合わせで</text>
  <text class="center-text" x="700" y="514" text-anchor="middle">力が出る</text>
  <text class="center-sub" x="700" y="544" text-anchor="middle">近い理解 / 遠い補完 / 3人目の化学反応</text>

  <rect class="axis" x="520" y="128" width="360" height="74" rx="14"/>
  <text class="axis-title" x="700" y="160" text-anchor="middle">創発型</text>
  <text class="axis-sub" x="700" y="184" text-anchor="middle">まだないものを生む・始める・未来を出す</text>

  <rect class="axis" x="1080" y="430" width="240" height="80" rx="14"/>
  <text class="axis-title" x="1200" y="462" text-anchor="middle">共鳴型</text>
  <text class="axis-sub" x="1200" y="486" text-anchor="middle">人を巻き込む・伝える・応援する</text>

  <rect class="axis" x="520" y="810" width="360" height="74" rx="14"/>
  <text class="axis-title" x="700" y="842" text-anchor="middle">現場型</text>
  <text class="axis-sub" x="700" y="866" text-anchor="middle">状況を見る・安心を作る・継続させる</text>

  <rect class="axis" x="82" y="430" width="240" height="80" rx="14"/>
  <text class="axis-title" x="202" y="462" text-anchor="middle">構造型</text>
  <text class="axis-sub" x="202" y="486" text-anchor="middle">整える・仕組みにする・磨き上げる</text>

  <g transform="translate(240 218)">
    <rect class="node ignite rare" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">常識の外から</text>
    <text class="main" x="126" y="59" text-anchor="middle">可能性を出す人</text>
    <text class="name" x="126" y="84" text-anchor="middle">クレイジスト</text>
  </g>

  <g transform="translate(574 190)">
    <rect class="node ignite rare" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">未来に火を灯し</text>
    <text class="main" x="126" y="59" text-anchor="middle">最初の一歩を作る人</text>
    <text class="name" x="126" y="84" text-anchor="middle">レボリスト</text>
  </g>

  <g transform="translate(908 218)">
    <rect class="node design" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">可能性を広げて</text>
    <text class="main" x="126" y="59" text-anchor="middle">企画にする人</text>
    <text class="name" x="126" y="84" text-anchor="middle">マックスデザイナー</text>
  </g>

  <g transform="translate(1036 340)">
    <rect class="node design" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">想いや空気を</text>
    <text class="main" x="126" y="59" text-anchor="middle">見える形にする人</text>
    <text class="name" x="126" y="84" text-anchor="middle">イメージマイスター</text>
  </g>

  <g transform="translate(1036 552)">
    <rect class="node connect" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">人と人の間に</text>
    <text class="main" x="126" y="59" text-anchor="middle">会話を生む人</text>
    <text class="name" x="126" y="84" text-anchor="middle">コミュニケーター</text>
  </g>

  <g transform="translate(908 684)">
    <rect class="node care" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">人の一歩を</text>
    <text class="main" x="126" y="59" text-anchor="middle">応援する人</text>
    <text class="name" x="126" y="84" text-anchor="middle">ムーブメンター</text>
  </g>

  <g transform="translate(574 714)">
    <rect class="node care" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">安心して話せる</text>
    <text class="main" x="126" y="59" text-anchor="middle">土台を作る人</text>
    <text class="name" x="126" y="84" text-anchor="middle">ソウルオーナー</text>
  </g>

  <g transform="translate(240 684)">
    <rect class="node connect" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">人・情報・役割を</text>
    <text class="main" x="126" y="59" text-anchor="middle">整えて流す人</text>
    <text class="name" x="126" y="84" text-anchor="middle">アレンジャー</text>
  </g>

  <g transform="translate(112 552)">
    <rect class="node structure" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">判断材料を集め</text>
    <text class="main" x="126" y="59" text-anchor="middle">知恵にする人</text>
    <text class="name" x="126" y="84" text-anchor="middle">インフォレイダー</text>
  </g>

  <g transform="translate(112 340)">
    <rect class="node structure" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">複雑なことを</text>
    <text class="main" x="126" y="59" text-anchor="middle">仕組みにする人</text>
    <text class="name" x="126" y="84" text-anchor="middle">ロジカルマイスター</text>
  </g>

  <g transform="translate(240 218)">
    <path d="M0 452 C-120 285 -115 145 0 52" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 8"/>
  </g>

  <g transform="translate(408 256)">
    <rect class="node care" width="252" height="104" rx="16"/>
    <text class="main" x="126" y="34" text-anchor="middle">価値を磨き上げ</text>
    <text class="main" x="126" y="59" text-anchor="middle">信頼にする人</text>
    <text class="name" x="126" y="84" text-anchor="middle">プルミエルクラフター</text>
  </g>

  <line x1="700" y1="294" x2="238" y2="392" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="1034" y1="604" x2="238" y2="392" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="700" y1="714" x2="1162" y2="392" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>

  <rect x="446" y="910" width="508" height="40" rx="20" fill="#f9fafb" stroke="#e5e7eb"/>
  <text class="hint" x="700" y="935" text-anchor="middle">名前は記号。先に「どんな働きか」を伝えることで、一般の人にも役割が伝わる。</text>
</svg>
