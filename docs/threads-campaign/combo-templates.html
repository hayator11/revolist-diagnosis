<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レボリスト診断 × Threads｜組み合わせ／チームカード（パラメータ量産版）</title>
<style>
  :root{
    --violet:#6B2CF5; --ink:#14121F; --paper:#FDFBFF; --smoke:#6B6880;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    background:#2b2735; color:var(--ink); padding:40px 16px 120px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .page-head{max-width:1100px; margin:0 auto 32px; color:#fff;}
  .page-head h1{font-size:24px; margin-bottom:8px;}
  .page-head p{font-size:14px; opacity:.85;}
  .page-head code{background:rgba(255,255,255,.15); padding:2px 6px; border-radius:6px; font-size:13px;}
  .grid{display:flex; flex-wrap:wrap; gap:40px; justify-content:center; max-width:1200px; margin:0 auto;}

  /* 1080x1350 = 4:5. On-screen at 0.4 scale; export at full 1080x1350. */
  .card{
    width:1080px; height:1350px; background:var(--paper);
    transform:scale(0.4); transform-origin:top left;
    position:relative; overflow:hidden; border-radius:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .card-slot{width:432px; height:540px;}
  .cap{color:#fff; font-size:13px; text-align:center; margin-top:12px; opacity:.9;}

  .wordmark{position:absolute; top:64px; left:72px; font-size:30px; font-weight:800; letter-spacing:.02em; color:var(--smoke); z-index:2;}
  .wordmark b{color:var(--violet);}
  .toplabel{position:absolute; top:140px; left:72px; right:72px; font-size:44px; font-weight:800; color:var(--smoke); z-index:2;}
  .pad{position:absolute; left:72px; right:72px;}
  .accentbar{position:absolute; left:0; bottom:0; width:100%; height:28px;}

  /* color blocks band */
  .band{position:absolute; left:0; width:100%; display:flex;}
  .blk{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px;}
  .blk .bname{font-weight:900; line-height:1.15;}
  .blk .bpower{font-weight:700; margin-top:14px;}

  /* connector */
  .conn{position:absolute; left:50%; transform:translateX(-50%);
        border-radius:50%; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.15);
        display:flex; align-items:center; justify-content:center; z-index:3;}
</style>
</head>
<body>
<div class="page-head">
  <h1>組み合わせ／チームカード（パラメータ量産版）</h1>
  <p>各カードは <code>1080 × 1350</code>（4:5）。<code>COMBOS</code> 配列に1件足すだけで任意ペア／トリオを量産できる。書き出しは <code>exports/export-combos.js</code>。</p>
</div>
<div class="grid" id="grid"></div>

<script>
// ---- パラメータ配列：ここに1件足すだけで新しい組み合わせカードが増える ----
// power = そのタイプの一言の役割ラベル / dark:true = 色地に黒文字（可読性/01-color-system準拠）
const COMBOS = [
  {
    file: "w3-01_revolist-x-movmentor.png",
    kind: "pair",
    toplabel: "組み合わせで能力アップ",
    a: { name:"レボリスト",     power:"はじめる力", color:"#E5322E", dark:false },
    b: { name:"ムーブメンター", power:"動かす力",   color:"#F08A0C", dark:true  },
    headline: "はじめる × 動かす",
    line: "最初の火種に、前へ進める風が吹く。",
    question: "あなたは「火をつける側」？「風を送る側」？",
  },
  {
    file: "w3-03_maxdesigner-x-premiercrafter.png",
    kind: "pair",
    toplabel: "組み合わせで能力アップ",
    a: { name:"マックスデザイナー",   power:"描く力",     color:"#7C3AED", dark:false },
    b: { name:"プルミエルクラフター", power:"仕上げる力", color:"#B45309", dark:false },
    headline: "描く × 仕上げる",
    line: "大きく広げた構想が、最高品質で形になる。",
    question: "あなたは「広げる側」？「仕上げる側」？",
  },
  {
    file: "w3-05_team-inforader.png",
    kind: "trio",
    toplabel: "3人でまとまるチーム",
    a: { name:"インフォレイダー", power:"調べる力",   color:"#0B9C6E", dark:true  },
    b: { name:"レボリスト",       power:"はじめる力", color:"#E5322E", dark:false },
    c: { name:"アレンジャー",     power:"整える力",   color:"#5B54F0", dark:false },
    headline: "調べる × はじめる × 整える",
    line: "根拠と行動と流れがそろう、奇数の安定チーム。",
    question: "あなたはこの3人のどれ？",
  },
];

const grid = document.getElementById("grid");

function slot(html, caption, file){
  const s = document.createElement("div");
  s.className = "card-slot";
  s.innerHTML = html + (caption ? `<div class="cap">${caption}</div>` : "");
  grid.appendChild(s);
}

function txt(dark){ return dark ? "#14121F" : "#ffffff"; }

function pairCard(c){
  const nameSize = 54, powerSize = 32;
  return `
  <div class="card" data-file="${c.file}">
    <div class="wordmark">レボ<b>リスト診断</b></div>
    <div class="toplabel">${c.toplabel}</div>

    <div class="band" style="top:240px; height:360px;">
      <div class="blk" style="background:${c.a.color}; color:${txt(c.a.dark)}">
        <div class="bname" style="font-size:${nameSize}px">${c.a.name}</div>
        <div class="bpower" style="font-size:${powerSize}px">${c.a.power}</div>
      </div>
      <div class="blk" style="background:${c.b.color}; color:${txt(c.b.dark)}">
        <div class="bname" style="font-size:${nameSize}px">${c.b.name}</div>
        <div class="bpower" style="font-size:${powerSize}px">${c.b.power}</div>
      </div>
    </div>
    <div class="conn" style="top:520px; width:130px; height:130px; font-size:70px">🤝</div>

    <div class="pad" style="top:700px; font-size:70px; font-weight:900; line-height:1.3; color:var(--ink)">${c.headline}</div>
    <div class="pad" style="top:840px; font-size:44px; font-weight:800; line-height:1.6; color:var(--ink)">${c.line}</div>
    <div class="pad" style="bottom:110px; font-size:40px; font-weight:800; color:var(--violet); line-height:1.5">${c.question}</div>

    <div class="accentbar" style="background:linear-gradient(90deg,${c.a.color},${c.b.color})"></div>
  </div>`;
}

function trioCard(c){
  const nameSize = 46, powerSize = 28;
  return `
  <div class="card" data-file="${c.file}">
    <div class="wordmark">レボ<b>リスト診断</b></div>
    <div class="toplabel">${c.toplabel}</div>

    <div class="band" style="top:240px; height:360px;">
      <div class="blk" style="background:${c.a.color}; color:${txt(c.a.dark)}">
        <div class="bname" style="font-size:${nameSize}px">${c.a.name}</div>
        <div class="bpower" style="font-size:${powerSize}px">${c.a.power}</div>
      </div>
      <div class="blk" style="background:${c.b.color}; color:${txt(c.b.dark)}">
        <div class="bname" style="font-size:${nameSize}px">${c.b.name}</div>
        <div class="bpower" style="font-size:${powerSize}px">${c.b.power}</div>
      </div>
      <div class="blk" style="background:${c.c.color}; color:${txt(c.c.dark)}">
        <div class="bname" style="font-size:${nameSize}px">${c.c.name}</div>
        <div class="bpower" style="font-size:${powerSize}px">${c.c.power}</div>
      </div>
    </div>
    <div class="conn" style="top:530px; width:150px; height:110px; border-radius:56px; font-size:38px; font-weight:900; color:var(--ink); flex-direction:column">
      <span style="font-size:34px">3人で</span><span style="font-size:34px">まとまる</span>
    </div>

    <div class="pad" style="top:710px; font-size:50px; font-weight:900; line-height:1.35; color:var(--ink)">${c.headline}</div>
    <div class="pad" style="top:850px; font-size:42px; font-weight:800; line-height:1.6; color:var(--ink)">${c.line}</div>
    <div class="pad" style="bottom:110px; font-size:40px; font-weight:800; color:var(--violet); line-height:1.5">${c.question}</div>

    <div class="accentbar" style="background:linear-gradient(90deg,${c.a.color} 0%,${c.a.color} 33%,${c.b.color} 33%,${c.b.color} 66%,${c.c.color} 66%,${c.c.color} 100%)"></div>
  </div>`;
}

COMBOS.forEach(c=>{
  const html = c.kind === "trio" ? trioCard(c) : pairCard(c);
  slot(html, c.file, c.file);
});
</script>
</body>
</html>
