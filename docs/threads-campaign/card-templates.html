<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レボリスト診断 × Threads｜カルーセル画像テンプレート</title>
<style>
  :root{
    --violet:#6B2CF5; --magenta:#D6208F; --coral:#FF5A3C;
    --ink:#14121F; --paper:#FDFBFF; --smoke:#6B6880;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    background:#2b2735; color:var(--ink); padding:40px 16px 120px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .page-head{max-width:1100px; margin:0 auto 32px; color:#fff;}
  .page-head h1{font-size:24px; margin-bottom:8px;}
  .page-head p{font-size:14px; opacity:.85;}
  .page-head code{background:rgba(255,255,255,.15); padding:2px 6px; border-radius:6px; font-size:13px;}
  .grid{display:flex; flex-wrap:wrap; gap:40px; justify-content:center; max-width:1200px; margin:0 auto;}

  /* 1080x1350 = 4:5. Rendered at 0.4 scale (432x540) for on-screen; screenshot then export at 1080x1350. */
  .card{
    width:1080px; height:1350px; background:var(--paper);
    transform:scale(0.4); transform-origin:top left;
    position:relative; overflow:hidden; border-radius:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .card-slot{width:432px; height:540px;} /* holds the scaled card so layout flows */
  .cap{color:#fff; font-size:13px; text-align:center; margin-top:12px; opacity:.9;}

  /* shared card internals */
  .wordmark{position:absolute; top:64px; left:72px; font-size:30px; font-weight:800; letter-spacing:.02em; color:var(--smoke);}
  .wordmark b{color:var(--violet);}
  .num{position:absolute; top:150px; left:72px; font-size:120px; font-weight:900; line-height:1;}
  .pad{position:absolute; left:72px; right:72px;}
  .tname{font-size:82px; font-weight:900; letter-spacing:.01em; line-height:1.1;}
  .tcatch{font-size:40px; font-weight:700; margin-top:24px; line-height:1.45;}
  .chips{display:flex; flex-wrap:wrap; gap:18px; margin-top:40px;}
  .chip{font-size:34px; font-weight:800; color:#fff; padding:14px 30px; border-radius:999px;}
  .sub{font-size:30px; color:var(--smoke); font-weight:700; margin-bottom:16px;}
  .move{font-size:40px; font-weight:800; line-height:1.5;}
  .move span{display:block;}
  .accentbar{position:absolute; left:0; bottom:0; width:100%; height:28px;}
  .colorname{position:absolute; bottom:64px; left:72px; font-size:28px; font-weight:800;}
  .qmark{position:absolute; top:150px; right:72px; font-size:150px; font-weight:900; opacity:.12;}

  /* cover */
  .cover{background:linear-gradient(135deg,var(--violet) 0%, var(--magenta) 55%, var(--coral) 100%); color:#fff;}
  .cover .big{position:absolute; left:72px; right:72px; top:360px; font-size:96px; font-weight:900; line-height:1.15;}
  .cover .lead{position:absolute; left:72px; right:72px; top:180px; font-size:42px; font-weight:700; opacity:.95;}
  .cover .foot{position:absolute; left:72px; right:72px; bottom:110px; font-size:40px; font-weight:800;}
  .cover .dots{position:absolute; left:72px; bottom:230px; display:flex; gap:16px; flex-wrap:wrap; width:900px;}
  .cover .dot{width:56px; height:56px; border-radius:50%;}
</style>
</head>
<body>
<div class="page-head">
  <h1>レボリスト診断 × Threads｜カルーセル画像テンプレート</h1>
  <p>各カードは <code>1080 × 1350</code>（4:5）。画面上は0.4倍表示。書き出し方：カードを右クリック→スクリーンショット、または開発者ツールでノード保存。Firefoxなら「スクリーンショットを撮る」でノード単位に保存可。</p>
</div>
<div class="grid" id="grid"></div>

<script>
const TYPES = [
  {n:"01", name:"レボリスト", catch:"未踏の地に最初の旗を立てる、世界を動かす火種", strengths:["突破力","行動力","影響力","挑戦力"], move:["まず動いて、","道は後から作る。"], color:"#E5322E", cname:"情熱のレッド"},
  {n:"02", name:"マックスデザイナー", catch:"可能性を最大化する創造者", strengths:["発想力","企画力","演出力","未来想像力"], move:["制約を、","一番面白い条件として楽しむ。"], color:"#7C3AED", cname:"創造のバイオレット"},
  {n:"03", name:"イメージマイスター", catch:"感性で空気を変える表現者", strengths:["デザイン感覚","感性","演出力","魅せる力"], move:["言葉より、","美しい空気感で伝える。"], color:"#DB2777", cname:"感性のマゼンタ"},
  {n:"04", name:"コミュニケーター", catch:"人と人を自然につなぐ、温かい架け橋", strengths:["対話力","調和力","安心感","巻き込み力"], move:["まず温かく聞いてから、","優しく話す。"], color:"#0BA5C4", cname:"調和のシアン"},
  {n:"05", name:"インフォレイダー", catch:"情報を武器に未来を読む、最強の羅針盤", strengths:["情報整理","観察力","リサーチ力","時流把握"], move:["まず深く調べてから、","確信を持って動く。"], color:"#0B9C6E", cname:"探究のエメラルド"},
  {n:"06", name:"ムーブメンター", catch:"空気を動かし、人を前へ進める原動力", strengths:["熱量","応援力","空気づくり","行動促進"], move:["仲間の小さな前進を、","絶対に見逃さない。"], color:"#F08A0C", cname:"熱狂のアンバー", darktext:true},
  {n:"07", name:"プルミエルクラフター", catch:"細部に魂を宿す、圧倒的な品質の職人", strengths:["品質管理","制作力","継続力","技術力"], move:["最後の仕上げの1%に、","魂を込める。"], color:"#B45309", cname:"匠のブロンズ"},
  {n:"08", name:"ロジカルマイスター", catch:"無茶を現実に変える、最強の設計者", strengths:["設計力","分析力","仕組み化","計画性"], move:["最も複雑なことを、","最もシンプルに整理する。"], color:"#2563EB", cname:"設計のブルー"},
  {n:"09", name:"アレンジャー", catch:"人と流れを美しく整える、チームの絶対的基盤", strengths:["管理力","調整力","サポート力","全体最適"], move:["全体の流れを見極め、","最も美しい動線を引く。"], color:"#5B54F0", cname:"調整のインディゴ"},
  {n:"10", name:"ソウルオーナー", catch:"人の心に深い灯りをともす、最高の理解者", strengths:["共感力","受容力","深い癒し","絶対的安心感"], move:["どんな感情も、","一切否定せず優しく受け取る。"], color:"#E8628A", cname:"安心のローズ"},
  {n:"11", name:"クレイジスト", catch:"常識の壁を越え、未来を持ち込む革命児", strengths:["圧倒的独創性","突破発想","次元の違う挑戦力","革命性"], move:["「無理」を、","最高の褒め言葉として受け取る。"], color:"#D01E6C", cname:"革命のディープローズ"},
];

const grid = document.getElementById('grid');

function slot(html, caption){
  const s = document.createElement('div');
  s.className = 'card-slot';
  s.innerHTML = html + (caption ? `<div class="cap">${caption}</div>` : '');
  grid.appendChild(s);
}

// ---- Cover card ----
slot(`
  <div class="card cover">
    <div class="lead">「性格診断」じゃない。<br>あなたが“どう動くと力が出るか”の話。</div>
    <div class="big">人には11の<br>才能タイプがある。</div>
    <div class="dots">
      ${TYPES.map(t=>`<div class="dot" style="background:${t.color}"></div>`).join('')}
    </div>
    <div class="foot">毎日ひとつ、色と一緒に紹介します。｜レボリスト診断</div>
  </div>
`, "表紙（シリーズ予告）");

// ---- 11 type cards ----
TYPES.forEach(t=>{
  const chipText = t.darktext ? 'var(--ink)' : '#fff';
  slot(`
  <div class="card">
    <div class="wordmark">レボ<b>リスト診断</b></div>
    <div class="num" style="color:${t.color}">#${t.n}</div>
    <div class="qmark" style="color:${t.color}">${t.name.slice(0,1)}</div>
    <div class="pad" style="top:300px">
      <div class="tname" style="color:${t.color}">${t.name}</div>
      <div class="tcatch">${t.catch}</div>
    </div>
    <div class="pad" style="top:720px">
      <div class="sub">強み</div>
      <div class="chips">
        ${t.strengths.map(s=>`<span class="chip" style="background:${t.color}; color:${chipText}">${s}</span>`).join('')}
      </div>
    </div>
    <div class="pad" style="top:1000px">
      <div class="sub">こう動くと力が出る</div>
      <div class="move">${t.move.map(m=>`<span>${m}</span>`).join('')}</div>
    </div>
    <div class="colorname" style="color:${t.color}">● ${t.cname}</div>
    <div class="accentbar" style="background:${t.color}"></div>
  </div>
  `, `#${t.n} ${t.name}`);
});

// ---- よくある特性 card ----
slot(`
  <div class="card">
    <div class="wordmark">レボ<b>リスト診断</b></div>
    <div class="pad" style="top:150px">
      <div class="tname" style="color:var(--violet); font-size:66px">“つい最初に<br>動いちゃう人”の特徴</div>
    </div>
    <div class="pad" style="top:470px; font-size:42px; font-weight:700; line-height:2.0">
      ✔️ 「誰かやる？」で手が挙がってる<br>
      ✔️ 計画より、まず動いて確かめたい<br>
      ✔️「無理かも」を「やれるかも」に変える<br>
      ✔️ 熱く語ると、人が集まってくる<br>
      ✔️ 細かい詰めは、得意な人に任せたい
    </div>
    <div class="pad" style="bottom:120px; font-size:40px; font-weight:800; color:var(--violet)">
      → 弱さじゃない。“最初の火種”という才能。
    </div>
    <div class="accentbar" style="background:linear-gradient(90deg,var(--violet),var(--magenta),var(--coral))"></div>
  </div>
`, "よくある特性（あるある）");

// ---- 組み合わせ card ----
slot(`
  <div class="card">
    <div class="wordmark">レボ<b>リスト診断</b></div>
    <div class="pad" style="top:140px; font-size:44px; font-weight:800; color:var(--smoke)">組み合わせで能力アップ</div>
    <div style="position:absolute; top:240px; left:0; width:100%; height:360px; display:flex">
      <div style="flex:1; background:#E5322E; display:flex; align-items:center; justify-content:center; color:#fff; font-size:54px; font-weight:900; text-align:center">レボリスト<br><span style="font-size:32px; font-weight:700">はじめる力</span></div>
      <div style="flex:1; background:#5B54F0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:54px; font-weight:900; text-align:center">アレンジャー<br><span style="font-size:32px; font-weight:700">整える力</span></div>
    </div>
    <div style="position:absolute; top:520px; left:50%; transform:translateX(-50%); width:130px; height:130px; border-radius:50%; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; font-size:70px">🤝</div>
    <div class="pad" style="top:700px; font-size:44px; font-weight:800; line-height:1.6">
      熱量が、<br>安全に・まっすぐ・遠くまで届く。
    </div>
    <div class="pad" style="top:900px; font-size:36px; line-height:1.7; color:var(--ink)">
      始める人の推進力は、そのままだと空回りしやすい。<br>
      整える人が入ると、現実の形になる。<br>
      <b>どっちが欠けても片手落ち。だから2人で無敵。</b>
    </div>
    <div class="pad" style="bottom:110px; font-size:40px; font-weight:800; color:var(--violet)">あなたは「始める側」？「整える側」？</div>
    <div class="accentbar" style="background:linear-gradient(90deg,#E5322E,#5B54F0)"></div>
  </div>
`, "組み合わせで能力アップ（相性）");
</script>
</body>
</html>
