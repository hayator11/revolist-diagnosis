<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レボリスト診断 — S1 カルーセル・スライド生成</title>
<style>
  :root{
    --ink:#0E1330; --ink2:#171C3D; --indigo:#4F46E5; --coral:#FF4D6D;
    --text:#F5F5FA; --muted:#8A90B8; --line:rgba(255,255,255,.1);
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#080B1C;color:var(--text);font-family:var(--sans);line-height:1.6}
  /* control bar */
  .bar{position:sticky;top:0;z-index:10;background:rgba(10,13,32,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .bar h1{font-size:1rem;font-weight:800;margin:0;letter-spacing:.01em}
  .bar .tag{font-size:.72rem;color:var(--muted)}
  select,button{font-family:inherit;font-size:.9rem;border-radius:10px;border:1px solid var(--line);
    background:var(--ink2);color:var(--text);padding:9px 13px;cursor:pointer}
  select{min-width:190px}
  button:hover{border-color:var(--indigo)}
  button.primary{background:var(--indigo);border-color:var(--indigo);font-weight:700}
  .hint{font-size:.76rem;color:var(--muted);flex-basis:100%;margin-top:2px}
  .board{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:26px 16px 80px}
  /* slide: self-scaling via container query units */
  .slide{width:min(430px,92vw);aspect-ratio:4/5;container-type:inline-size;border-radius:18px;
    overflow:hidden;position:relative;color:var(--tc,#fff);box-shadow:0 14px 40px rgba(0,0,0,.5);
    background:linear-gradient(150deg,var(--key),var(--grad));display:flex;flex-direction:column;
    padding:8cqw;justify-content:space-between}
  body.big .slide{width:1080px;max-width:96vw}
  .slide .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw}
  .kicker{font-size:3.1cqw;letter-spacing:.28em;text-transform:uppercase;font-weight:700;opacity:.9}
  .num{font-size:3cqw;font-weight:700;opacity:.8;font-variant-numeric:tabular-nums}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3cqw;padding:4cqw 0}
  .hook{font-size:8.4cqw;font-weight:800;line-height:1.24;letter-spacing:-.01em;text-wrap:balance;
    text-shadow:0 0.4cqw 2cqw rgba(0,0,0,.22)}
  .empathy{font-size:5cqw;font-weight:600;line-height:1.7}
  .tname{font-size:11cqw;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-shadow:0 0.5cqw 2cqw rgba(0,0,0,.25)}
  .catch{font-size:4.4cqw;font-weight:600;opacity:.95;line-height:1.5}
  .heading{font-size:5.4cqw;font-weight:800;margin-bottom:1cqw}
  .concept{align-self:flex-start;font-size:3.4cqw;font-weight:700;background:rgba(0,0,0,.22);
    padding:1.6cqw 3.4cqw;border-radius:10cqw;backdrop-filter:blur(2px)}
  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2.6cqw}
  ul.items li{display:flex;gap:3cqw;align-items:flex-start;font-size:5cqw;font-weight:600}
  ul.items li .b{flex:none;width:3.4cqw;height:3.4cqw;border-radius:50%;background:currentColor;
    margin-top:2.2cqw;opacity:.85}
  ul.items.sm li{font-size:4.3cqw;font-weight:500;line-height:1.55}
  .big-name{font-size:9cqw;font-weight:800;line-height:1.1}
  .reason{font-size:4.2cqw;font-weight:500;line-height:1.6;opacity:.96}
  .chip-row{display:flex;flex-wrap:wrap;gap:2cqw;margin-top:1cqw}
  .chip{font-size:3.5cqw;font-weight:700;background:rgba(0,0,0,.2);padding:1.4cqw 3cqw;border-radius:8cqw}
  .cta{background:rgba(0,0,0,.26);border-radius:4cqw;padding:4.5cqw;display:flex;flex-direction:column;gap:2cqw}
  .cta .big{font-size:5cqw;font-weight:800}
  .cta .sub{font-size:3.7cqw;font-weight:500;opacity:.95}
  .recap{display:flex;flex-direction:column;gap:2cqw;font-size:4cqw}
  .recap .r{display:flex;gap:2.5cqw}.recap .r b{opacity:.7;font-weight:700;white-space:nowrap}
  .sig{display:flex;align-items:center;gap:2cqw;font-size:3.4cqw;font-weight:700;opacity:.95}
  .sig .d{width:2.8cqw;height:2.8cqw;border-radius:50%;background:var(--coral)}
  .swipe{font-size:3.4cqw;font-weight:700;opacity:.85}
  @media print{
    .bar{display:none}.board{padding:0;gap:0}
    .slide{width:100%;max-width:100%;border-radius:0;box-shadow:none;break-after:page}
    body{background:#fff}
  }
</style>
</head>
<body>
  <div class="bar">
    <h1>S1 スライド生成</h1>
    <span class="tag">レボリスト診断 / @____hayator</span>
    <select id="pick" aria-label="タイプを選択"></select>
    <button id="prev">← 前</button>
    <button id="next">次 →</button>
    <button id="zoom">実寸1080pxで表示</button>
    <button class="primary" id="print">印刷 / PDF保存</button>
    <p class="hint">タイプを選ぶと9枚のカルーセルが生成されます。各スライドをスクショ、または「印刷/PDF保存」で1枚ずつ書き出し（1080×1350で設計）。キャプションは <code>06_season1-scripts.md</code> 参照。</p>
  </div>
  <div class="board" id="board"></div>

<script>

  hook:"あなたが段取りを引くと、\n全員が驚くほど動ける。",
  empathy:"あなたがさりげなく動線を引くことで、全員が驚くほどスムーズに動けるようになっています。",
  strengths:["管理力","調整力","サポート力","全体最適"], gives:["圧倒的な安定","美しい流れ","最高の安心感"],
  principles:["全体の流れを見極め、最も美しい動線を引く","調整は早いほど価値が高い。即座に動く"],
  pair:"レボリスト", reason:"整えた滑らかな道に推進力が加わり、動きやすさが前進に変わる。",

  env:"会議で「もっと面白くするなら?」と問いかける。"},

  catch:"情報を武器に未来を読む、最強の羅針盤",
  hook:"「なぜ?」を追いかけ、\n気づけば誰より\n詳しくなっている。",
  empathy:"「なぜ?」を深く追いかけ、気づけば誰よりも詳しくなっている。それが息をするほど自然なはず。",
  strengths:["情報整理","観察力","リサーチ力","時流把握"], gives:["確かな情報","深い洞察","最適な判断材料"],

  env:"判断に必要なデータを、先回りして集め驚かせる。"},

 {k:"soulowner",name:"ソウルオーナー",key:"#6D5BD0",grad:"#9B8CFF",tc:"#fff",concept:"癒しの菫",
  catch:"人の心に深い灯りをともす、最高の理解者",
  hook:"誰かの心の機微に、\n真っ先に\n気づいてしまう。",
  empathy:"誰かの心の奥の感情に敏感に気づき、すべてを温かく受け止める深い器を持っています。",
  strengths:["共感力","受容力","深い癒し","絶対的安心感"], gives:["究極の安心","深い優しさ","受け入れる居場所"],

  pair:"コミュニケーター", reason:"深い共感が、より多くの人との温かい繋がりへと広がっていく。",
  env:"話しづらそうな人に、誰よりも早く、温かく声をかける。"},

  hook:"「もう少し良くできる」で、\n最後まで仕上げ続ける。",
  empathy:"「もう少し良くできる」という美学を持ち、細部まで丁寧に仕上げる力を持っています。",
  strengths:["品質管理","制作力","継続力","技術力"], gives:["最高品質","極めて高い丁寧さ","絶対的な信頼"],

  pair:"レボリスト", reason:"生まれた最高の作品を、いち早く世界へ届けてくれる。",
  env:"成果物の最終品質チェックの、最後の砦を担当する。"},

 {k:"crazist",name:"クレイジスト",key:"#BE185D",grad:"#FF2D78",tc:"#fff",concept:"革命のマゼンタ",
  catch:"常識の壁を越え、未来を持ち込む革命児",
  hook:"「なぜみんな、その\nやり方で納得できるの?」\nと思ってしまう。",
  empathy:"「なぜみんなそのやり方で納得できるの?」という根源的な問いが、内側に常にあります。",
  strengths:["圧倒的独創性","突破発想","次元の違う挑戦力","革命性"], gives:["最高の驚き","新次元の発想","未来へのワクワク"],
  principles:["常識の遥か外側にこそ、真の答えがあると信じ抜く","誰とも同じにしなくていい。圧倒的なオリジナルで在る"],
  pair:"ロジカルマイスター", reason:"「面白い」が「実現可能」へと翻訳され、誰も真似できない価値になる。",

const sig = (n)=>`<div class="sig"><span class="d"></span>レボリスト診断</div><span class="num">${n} / 9</span>`;
const footer = (n)=>`<div class="top" style="align-items:flex-end">${sig(n)}</div>`;

function slides(t){
  const S=[];
  // 1 hook
  S.push(`<div class="mid" style="justify-content:space-between">
      <div class="top"><span class="kicker">これ、あなたかも?</span><span class="num">1 / 9</span></div>
      <div class="hook">${t.hook.replace(/\n/g,"<br>")}</div>
      <div class="top" style="align-items:flex-end"><div class="sig"><span class="d"></span>レボリスト診断</div><span class="swipe">スワイプ →</span></div>
    </div>`);
  // 2 empathy
  S.push(`<div class="top"><span class="kicker">わかる…</span><span class="num">2 / 9</span></div>
    <div class="mid"><div class="empathy">${t.empathy}</div></div>${footer(2).replace('<div class="top" style="align-items:flex-end">','<div class="top" style="align-items:flex-end;justify-content:space-between">')}`);
  // 3 reveal
  S.push(`<div class="top"><span class="kicker">あなたのタイプは</span><span class="num">3 / 9</span></div>
    <div class="mid"><div class="tname">${t.name}</div><div class="catch">${t.catch}</div><span class="concept">${t.concept}</span></div>
    <div class="top" style="align-items:flex-end;justify-content:space-between">${sig(3)}</div>`);
  // helper for content slides
  const body=(kick,n,inner)=>`<div class="top"><span class="kicker">${kick}</span><span class="num">${n} / 9</span></div>
    <div class="mid">${inner}</div><div class="top" style="align-items:flex-end;justify-content:space-between">${sig(n)}</div>`;
  // 4 strengths
  S.push(body("STRENGTHS",4,`<div class="heading">あなたの強み</div>
    <ul class="items">${t.strengths.map(s=>`<li><span class="b"></span>${s}</li>`).join("")}</ul>`));
  // 5 gives
  S.push(body("GIVES",5,`<div class="heading">自然に、周りへ<br>渡しているもの</div>
    <ul class="items">${t.gives.map(s=>`<li><span class="b"></span>${s}</li>`).join("")}</ul>`));
  // 6 principles
  S.push(body("HOW TO MOVE",6,`<div class="heading">こう動くと、力が出る</div>
    <ul class="items sm">${t.principles.map(s=>`<li><span class="b"></span>${s}</li>`).join("")}</ul>`));
  // 7 pair
  S.push(body("BEST PARTNER",7,`<div class="heading">組むと動きやすいのは</div>
    <div class="big-name">${t.pair}</div><div class="reason">${t.reason}</div>`));
  // 8 env
  S.push(body("TRY NOW",8,`<div class="heading">今いる環境で<br>試すなら</div>
    <div class="reason" style="font-size:5cqw;font-weight:600">${t.env}</div>`));
  // 9 cheatsheet + CTA
  S.push(`<div class="top"><span class="kicker">まとめ</span><span class="num">9 / 9</span></div>
    <div class="mid" style="gap:4cqw">
      <div class="recap">
        <div class="r"><b>タイプ</b><span>${t.name}</span></div>
        <div class="r"><b>ひとこと</b><span>${t.catch}</span></div>
        <div class="r"><b>強み</b><span>${t.strengths.join("・")}</span></div>
        <div class="r"><b>相性</b><span>${t.pair}</span></div>
      </div>
      <div class="cta">
        <span class="big">あなたは何タイプ？</span>
        <span class="sub">プロフィールのリンクから無料診断（約1分）</span>
        <span class="sub">📌 保存 ／ 🔁 友達にシェア ／ 💬 当たった人はコメントで</span>
      </div>
    </div>
    <div class="top" style="align-items:flex-end;justify-content:space-between">${sig(9)}</div>`);
  return S;
}

const board=document.getElementById("board"), pick=document.getElementById("pick");
T.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${i+1}. ${t.name}`;pick.appendChild(o);});

function render(i){
  const t=T[i];
  board.style.setProperty("--key",t.key); board.style.setProperty("--grad",t.grad);
  board.innerHTML=slides(t).map(html=>
    `<div class="slide" style="--key:${t.key};--grad:${t.grad};--tc:${t.tc}">${html}</div>`).join("");
  pick.value=i;
}
let cur=0; render(0);
pick.onchange=e=>{cur=+e.target.value;render(cur);};
document.getElementById("prev").onclick=()=>{cur=(cur-1+T.length)%T.length;render(cur);};
document.getElementById("next").onclick=()=>{cur=(cur+1)%T.length;render(cur);};
document.getElementById("zoom").onclick=e=>{document.body.classList.toggle("big");
  e.target.textContent=document.body.classList.contains("big")?"画面に合わせる":"実寸1080pxで表示";};
document.getElementById("print").onclick=()=>window.print();
</script>
</body>
</html>
